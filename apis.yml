name: Calibrate
description: 'Calibrate is a telehealth metabolic-health and weight-loss company that pairs
  clinician-prescribed GLP-1 medications with 1:1 video coaching and a science-backed educational
  curriculum to help members improve metabolic health and achieve sustainable weight loss. Programs
  are sold directly to individuals (from $199/month) and through employer benefits. Calibrate delivers
  its service through consumer web and iOS mobile apps rather than a public developer API; this profile
  tracks the company''s public web and account surface. Backed by Threshold Ventures.'
